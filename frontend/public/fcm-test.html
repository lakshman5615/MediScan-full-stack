<!DOCTYPE html>
<html>
<head>
    <title>FCM Token Generator - MediScan</title>
</head>
<body>
    <h1>Generate FCM Token</h1>
    <button onclick="generateToken()">Generate Token</button>
    <div id="result"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js';
        import { getMessaging, getToken } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-messaging.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAX3A-Vc102Xx-uoAvIyh3sX4gzfGojXD4",
            authDomain: "mediscan-notifications.firebaseapp.com",
            projectId: "mediscan-notifications",
            storageBucket: "mediscan-notifications.firebasestorage.app",
            messagingSenderId: "1094554203665",
            appId: "1:1094554203665:web:7b8d495c93d08416e8a3b0"
        };

        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);

        window.generateToken = async function() {
            const result = document.getElementById('result');
            result.innerHTML = 'Requesting permission...';

            try {
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') {
                    result.innerHTML = '❌ Permission denied';
                    return;
                }

                result.innerHTML = 'Registering service worker...';
                const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
                await navigator.serviceWorker.ready;

                result.innerHTML = 'Getting FCM token...';
                const token = await getToken(messaging, {
                    vapidKey: 'BCDVAB6Kcn6GyveyDK3XmHbwmkEDmqBhQkl8ko0m14Lh7UxgYOd2hwQJB-bao-JqSYR9q6d5h3sboXkywL--QMA',
                    serviceWorkerRegistration: registration
                });

                if (token) {
                    result.innerHTML = `
                        <h2>✅ Token Generated!</h2>
                        <p><strong>Length:</strong> ${token.length} chars</p>
                        <textarea style="width:100%;height:100px">${token}</textarea>
                        <h3>Save to Database:</h3>
                        <pre>db.users.updateOne(
  { email: "radha@gmail.com" },
  { $set: { fcmToken: "${token}" } }
)</pre>
                    `;
                    console.log('FCM Token:', token);
                } else {
                    result.innerHTML = '❌ No token received';
                }
            } catch (error) {
                result.innerHTML = `❌ Error: ${error.message}`;
                console.error(error);
            }
        };
    </script>
</body>
</html>
